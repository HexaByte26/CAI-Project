<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="static/css/Main.css">
    <link rel="stylesheet" href="static/css/landing_page.css">
    <script src="static/js/java.js" defer></script>
</head>
<body>
    <div class="stage">
        <header class="smart-nav">
            <nav>
                <ul>
                    <li><a href="#">About us</a></li>
                    <li><a href="#">Email us</a></li>
                    <li><a href="#" class="btn-login">Log In</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="hero-section">
                <div class="hero-image-container">
                    <img src="static/images/spinning_circuit.jpeg" alt="NE555N microchip">
                </div>
                <div class="hero-text-overlay">
                    <h1 class="chrome-text">Learn about</h1>
                    <ul>
                        <li>Sequential Circuits</li>
                        <li>Synchronous Counters</li>
                        <li>Asynchronous Counters</li>
                    </ul>
                </div>
            </section>

            <section class="signup-section">
                <div class="signup-box glass">
                    <p>You found us. The algorithm finally got something right.</p>
                    <a href="#" class="btn-signup">Sign Up</a>
                    <a href="#" class="btn-guest">Continue as Guest</a>
                </div>
            </section>
        </main>
    </div>

</html>
